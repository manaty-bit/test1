<style>

<div class="app" id="app">

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;

 {id:'kite-asa',title:'左右の辺を証明',shape:'kite',kind:2,given:'∠BAD＝∠DAC、∠BDA＝∠ADC',goal:'BD＝CD を証明しよう',tri:'△ABDと△ACD',triWrong:['△ABCと△BDC','△ABDと△BCD'],fact:[{v:'∠BAD＝∠DAC',why:'仮定より',refs:['BAD','DAC']},{v:'∠BDA＝∠ADC',why:'仮定より',refs:['BDA','ADC']},{v:'AD＝AD',why:'共通な辺だから',refs:['AD']}],wrong:['AB＝BD','∠BAD＝∠BDA'],cong:'△ABD≡△ACD',congWrong:['△ABD≡△ADC','△ABD＝△ACD'],result:'BD＝CD',resultWrong:['AB＝BD','AD＝CD'],reason:'辺',edgeGroups:[],angleGroups:[['BAD','DAC'],['BDA','ADC']],shared:['AD'],resultRefs:['BD','CD']},

 {id:'pair-asa',title:'2つの角を使う証明',shape:'separate',kind:2,given:'AB＝DE、∠BAC＝∠EDF、∠ABC＝∠DEF',goal:'AC＝DF を証明しよう',tri:'△ABCと△DEF',triWrong:['△ABCと△DFE','△ABCと△EFD'],fact:[{v:'AB＝DE',why:'仮定より',refs:['AB','DE']},{v:'∠BAC＝∠EDF',why:'仮定より',refs:['BAC','EDF']},{v:'∠ABC＝∠DEF',why:'仮定より',refs:['ABC','DEF']}],wrong:['AB＝EF','∠BAC＝∠DEF'],cong:'△ABC≡△DEF',congWrong:['△ABC≡△DFE','△ABC＝△DEF'],result:'AC＝DF',resultWrong:['AC＝EF','BC＝DF'],reason:'辺',edgeGroups:[['AB','DE']],angleGroups:[['BAC','EDF'],['ABC','DEF']],shared:[],resultRefs:['AC','DF']}

const MODES={study:[20,25,30],normal:[12,17,22],challenge:[7,10,14]};

function sound(f=390,t='square',len=.07,volume=.035){if(!audio)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+len);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+len)}catch(e){}}

 const out=[0,1,2].map(k=>shuffled(TASKS.filter(t=>t.kind===k))[0]);return shuffled(out).map(t=>t.id)}

 if(k==='facts') {let good=t.fact.filter(f=>!state.picked.includes(f.v)).map(f=>f.v);return {title:`等しい根拠を集めよう（${state.picked.length}/3）`,type:'根拠を自由に選ぶ',choices:[...good,...t.wrong].slice(0,5),correct:good,hint:t.kind===2?'与えられた角と、その両端を結ぶ辺に注目。':t.kind===1?'2組の辺と、その間の角に注目しよう。':'3組の辺の等しさを集めよう。'};}
 if(k==='condition')return{title:'使える合同条件は？',type:'合同条件',choices:CONDITIONS,correct:[CONDITIONS[t.kind]],hint:'集めた等しさは「辺」が何組、「角」が何組かな？'};
 if(k==='cong')return{title:'合同を正しく表す式は？',type:'合同の式',choices:[t.cong,...t.congWrong],correct:[t.cong],hint:'頂点の対応順を守ろう。「≡」は合同を表す記号。'};
 if(k==='reason'){let correct=`合同な図形の対応する${t.reason}はそれぞれ等しいので、`,other=t.reason==='辺'?'角':'辺';return{title:'合同から結論を導く理由は？',type:'合同の利用',choices:[correct,`合同な図形の対応する${other}はそれぞれ等しいので、`,'仮定より、'],correct:[correct],hint:'結論で示すのは「辺」の等しさ？「角」の等しさ？'};}
 return{title:'最後に証明する式は？',type:'結論',choices:[t.result,...t.resultWrong],correct:[t.result],hint:'問題文に書かれた最終目標を確認しよう。'};
}
function makeChoices(spec){let pool=spec.choices;if(stepKind()==='facts'){// maximum 4 options; always retain at least one valid candidate

 return shuffled(pool).slice(0,4)
}

function gameOver(){state.phase='gameover';showOverlay(`<div class="big">🪨 💥</div><h2>岩盤にぶつかった！</h2><p>${state.taskIndex+1}問目の関門で失敗。<br>正しい証明をもう一度つなげよう。</p><button class="primary" id="retry">↺ 最初から再挑戦</button><button class="secondary" id="notesBtn">📓 途中までの証明を見る</button>`);$('retry').onclick=start;$('notesBtn').onclick=showNotes;updateUI()}
function proofHtml(){const rows=state.notes.map((line,i)=>`<button type="button" class="proofrow" data-line="${i}"><b>${String(i+1).padStart(2,'0')}.</b> ${esc(line.text)}</button>`).join('');return `<div class="proof"><h3>完成した証明（各行を押すと図で確認）</h3>${rows||'<p>まだ証明は始まっていません。</p>'}</div>`}

function finishTask(repeat=false){state.phase='between';if(!repeat)state.completed.push(task().id);let misses=state.wrong-state.taskWrong,used=state.hints-state.taskHints,seconds=Math.round(state.elapsed-state.taskStarted),stars=misses===0&&used===0?3:misses<=2?2:1;const more=state.taskIndex<2;showOverlay(`<div class="big">💎 🐾 💎</div><h2>${more?'証明完成！':'全問クリア！'}</h2><div class="result-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${state.taskIndex+1}/3 問クリア！　この問題：${seconds}秒・ミス${misses}回・ヒント${used}回<br>3問合計：${Math.round(state.completed.length*8/(state.completed.length*8+state.wrong)*100)}% 正解（ミス・時間切れ込み）<br>証明の各行をタップすると図で確かめられるよ。</p>${proofHtml()}<button class="primary" id="continue">${more?'▶ 次の証明へ':'↺ 新しい3問に挑戦'}</button>`);wireProof();$('continue').onclick=()=>{if(more){state.taskIndex++;state.phase='playing';$('overlay').hidden=true;loadTask()}else start()};setMessage('証明完成！');sound(980,'square',.19);updateUI()}
function showOverlay(html,review=false){

function drawFigure(highlight=[]){const t=task(),pts=POINTS[t.shape];let lines=t.shape==='kite'?[['A','B'],['B','D'],['D','A'],['A','C'],['C','D']]:t.shape==='cross'?[['A','O'],['O','B'],['B','A'],['C','O'],['O','D'],['D','C']]:[['A','B'],['B','C'],['C','A'],['D','E'],['E','F'],['F','D']];let s='';
 const segment=(a,b,col='#39576a',width=2.8)=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="${col}" stroke-width="${width}" stroke-linecap="round"/>`;
 if(t.shape==='kite'){s+=`<polygon points="${['A','B','D'].map(k=>pts[k].join(',')).join(' ')}" fill="#c4dee6" opacity=".65"/><polygon points="${['A','D','C'].map(k=>pts[k].join(',')).join(' ')}" fill="#c4dee6" opacity=".65"/>`}
 else if(t.shape==='cross'){s+=`<polygon points="${['A','O','B'].map(k=>pts[k].join(',')).join(' ')}" fill="#c4dee6" opacity=".7"/><polygon points="${['C','O','D'].map(k=>pts[k].join(',')).join(' ')}" fill="#c4dee6" opacity=".7"/>`}
 else{s+=`<polygon points="${['A','B','C'].map(k=>pts[k].join(',')).join(' ')}" fill="#c4dee6" opacity=".7"/><polygon points="${['D','E','F'].map(k=>pts[k].join(',')).join(' ')}" fill="#c4dee6" opacity=".7"/>`}

 function tick(seg,count){let p=pts[seg[0]],q=pts[seg[1]],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;let ret='';for(let j=0;j<count;j++){let f=(j-(count-1)/2)*7,x=(p[0]+q[0])/2+f*dx/L,y=(p[1]+q[1])/2+f*dy/L;ret+=`<path d="M ${x-6*nx} ${y-6*ny} L ${x+6*nx} ${y+6*ny}" stroke="#d47239" stroke-width="3" stroke-linecap="round"/>`}return ret}

 for(let [name,p] of Object.entries(pts)){let dx=name==='B'||name==='D'&&t.shape==='cross'?-17:name==='C'||name==='F'?8: name==='O'?8: -6,dy=name==='A'||name==='D'&&t.shape==='separate'?-7:name==='O'?-6:17;if(name==='D'&&t.shape==='kite'){dx=9;dy=9}s+=`<text x="${p[0]+dx}" y="${p[1]+dy}" font-size="15" fill="#23374b" font-weight="800">${name}</text>`}

}
function hash(x,y,z=0){let n=Math.imul(x+139,374761393)^Math.imul(y+z+17,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}

function frame(t){let dt=Math.min(100,Math.max(0,t-(last||t)));last=t;if(state.phase==='playing'){

 if(!state.chosen){state.remaining=Math.max(0,state.remaining-dt/1000);state.p=Math.min(1,1-state.remaining/state.limit);if(state.remaining<=0)collision()}
 else{state.p=Math.min(1,state.p+dt/480);if(state.p>=1)advanceStep()}
} else if(state.phase==='collision'){state.collisionClock-=dt;if(state.collisionClock<=0){if(state.lives===0)gameOver();else{state.phase='playing';setStep()}}}
