<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2b">
<title>モグラの証明ダッシュ｜合同の証明タイムアタック</title>
<style>
:root{--bg:#101b2b;--panel:#20334a;--border:#667f8a;--gold:#f5d484;--ink:#fff6de;--pale:#efe8d2;--green:#a1efd1;--red:#ffaaa2;--brown:#573823;--score:#f3b964}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -10%,#2f5062,transparent 65%),#101b2b;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fffbc9;outline-offset:1px}
[hidden]{display:none!important}
.app{max-width:760px;margin:0 auto;width:100%;height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:6px 8px 7px;gap:6px;overflow:hidden}
.top{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 5px}
.brand{display:flex;gap:7px;align-items:center;min-width:0}.brand-mark{width:31px;height:31px;display:grid;place-items:center;background:#654f32;border:2px solid #e0bb73;box-shadow:3px 3px 0 #080e16;font-size:16px}.brand-txt{min-width:0}.brand-txt b{display:block;font-size:clamp(14px,3.7vw,18px);line-height:1.22;white-space:nowrap}.brand-txt small{display:block;line-height:1.1;font:bold 9px monospace;letter-spacing:.1em;color:#b7d6d3}.tiny{font-weight:800;color:#e9dfcd;background:#263c4c;border:1px solid #89a5a7;padding:6px 9px;font-size:11px;white-space:nowrap}
.diagram{flex:0 0 auto;min-height:0;display:grid;grid-template-columns:1fr;gap:0;background:#efe5cb;border:3px solid #ac8855;box-shadow:inset 0 0 0 2px #fff1cf;color:#263443}
.diagram-top{display:flex;align-items:center;justify-content:space-between;padding:3px 8px 0;gap:6px}.diagram-top strong{font-size:11px;letter-spacing:.02em}.diagram-top span{font-size:10px;color:#5d5e5b}.figure{height:clamp(91px,14dvh,137px);width:100%;display:block;padding:0 4px;overflow:visible}.diagram-note{padding:0 8px 4px;text-align:center;font-weight:700;font-size:10px;color:#595b55}
.status{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;flex:0 0 46px;min-height:46px;padding:6px 9px;background:#21344b;border:2px solid #587786;box-shadow:2px 2px #080e16}
.progress-text{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:#f3deaa;margin-bottom:3px}.timebar{height:9px;background:#0e2030;position:relative;border:1px solid #698390}.timebar i{height:100%;width:100%;display:block;background:linear-gradient(90deg,#5bccb3,#b5f3bd);transition:background .15s}.timebar.warning i{background:linear-gradient(90deg,#f16b59,#f5b85d)}
.timer{min-width:72px;text-align:right;font:900 clamp(19px,5vw,27px)/1 ui-monospace,monospace;color:#ffdc87;font-variant-numeric:tabular-nums}.timer.warning{color:#ff8e7f;animation:pulse .4s steps(2) infinite}.hearts{font-size:16px;letter-spacing:1px;color:#ff978d;white-space:nowrap}
.mine{flex:1 1 auto;min-height:110px;position:relative;overflow:hidden;border:3px solid #946e49;background:#523927;box-shadow:inset 0 0 0 2px #30241e,3px 3px #090e15;isolation:isolate}
.mine canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.mine-top{position:absolute;top:5px;left:6px;right:6px;pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.depth{font:bold 10px monospace;background:#172b36e6;color:#ffe5ac;border:1px solid #8d9e9c;padding:4px 6px}.speech{background:#16283be6;border:1px solid #a3b5aa;padding:3px 7px;color:#eaf4e6;font-size:10px;max-width:70%;text-align:right}.mine-bottom{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}.lane-guide{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:380px;gap:4px;padding:0 6px}.lane-guide span{font:900 12px monospace;color:#f9dc8b;text-shadow:1px 2px #1d1b17;text-align:center}
.quiz{flex:0 0 auto;min-height:0;background:#172a3e;border:2px solid #78909b;box-shadow:3px 3px 0 #0c121a;padding:8px 9px 9px;display:flex;flex-direction:column;gap:7px}
.question{display:flex;align-items:flex-start;gap:6px;justify-content:space-between}.question h2{margin:0;font-size:clamp(13px,3.4vw,17px);line-height:1.35;color:#ffdf9f}.question small{font-size:10px;color:#c2d1d4;font-weight:700;white-space:nowrap}
.answers{display:grid;gap:5px}.answer{min-height:37px;text-align:left;display:flex;gap:9px;align-items:center;width:100%;border:2px solid #668391;background:#2a4859;color:#fff6e0;padding:6px 9px;line-height:1.26;font-weight:750;font-size:clamp(12px,3.1vw,15px);box-shadow:inset 2px 2px #3c6170;transition:background .12s}
.answer b{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;background:#172a36;border:1px solid #f1ca79;color:#f2d78e;font:900 12px monospace}.answer:disabled{cursor:default}.answer.good{background:#14664c;border-color:#b6f4bb;color:#f1ffe8}.answer.wrong{background:#6c3d3d;border-color:#f4aaa1;color:#ffebdd;animation:shake .25s steps(4)}.answer:active:not(:disabled){transform:translateY(1px)}
.minirow{display:flex;align-items:center;justify-content:space-between;gap:7px}.feedback{font-size:11px;min-height:15px;color:#f4ce9c;font-weight:700;line-height:1.3}.hint{padding:5px 9px;border:1px solid #e6c17c;background:#554729;color:#fff0c1;font-weight:800;font-size:11px;white-space:nowrap}.hint:disabled{opacity:.55}.hint-reveal{font-size:11px;background:#2f4245;border-left:3px solid #efd385;padding:5px 7px;line-height:1.35;color:#fff1ce}
.footer{flex:0 0 27px;display:flex;gap:7px;align-items:center;justify-content:space-between}.footer small{color:#abc2c8;font-size:10px;line-height:1.2;white-space:nowrap}.footer button{border:1px solid #7c949f;color:#e7eee9;background:#254051;padding:4px 9px;font-size:11px;font-weight:800}
.overlay{position:absolute;inset:0;z-index:10;background:#0c1828e8;display:grid;place-items:center;padding:10px;text-align:center;overflow:auto}.modal{width:min(390px,100%);max-height:100%;overflow:auto;background:#182d40;border:3px solid #e1bf7f;box-shadow:inset 0 0 0 3px #344e5f,6px 6px 0 #0b121c;padding:19px 13px;display:flex;flex-direction:column;align-items:center;gap:10px}.modal .big{font-size:30px;line-height:1}.modal h2{font-size:clamp(18px,4.8vw,25px);color:#ffdf96;margin:0}.modal p{margin:0;font-size:13px;line-height:1.6;color:#e2eadf}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}.mode{padding:8px 4px;color:#e6f0f3;background:#2b4759;border:2px solid #597888;font-size:12px;font-weight:800}.mode.active{background:#5b5132;border-color:#f7d587;color:#fff4d3}.mode small{display:block;font-size:10px;color:#d0d5d5;font-weight:600}.primary{width:100%;background:#c58145;border:2px solid #ffe09b;padding:12px;color:#fff7e2;font-weight:900;font-size:16px;box-shadow:inset 2px 2px #eaae65,3px 3px #080e15}.secondary{width:100%;background:#294c5c;border:1px solid #92b6b9;color:#e8f5ed;padding:8px;font-weight:800}.modal .tiny-note{font-size:11px;color:#b6cbd0}.proof{max-height:min(50dvh,360px);overflow:auto;width:100%;text-align:left;background:#f6efd9;border:3px solid #bd9c64;color:#2d3c4b;padding:12px;font-size:13px;line-height:1.7}.proof div{padding:2px 0;border-bottom:1px dashed #d2c6a5}.proof h3{margin:0 0 6px;font-size:14px;color:#533d29}.result-stars{font-size:26px;color:#f4d781;letter-spacing:4px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes pulse{50%{opacity:.5}}
@media(min-width:700px){.app{padding:10px 14px 10px;gap:9px}.top{height:45px;flex-basis:45px}.figure{height:140px}.mine{min-height:175px}.quiz{padding:11px 13px;gap:9px}.answer{min-height:42px}.footer{flex-basis:32px}}
@media(max-height:720px){.app{gap:4px;padding:3px 5px 4px}.top{height:30px;flex-basis:30px}.diagram{border-width:2px}.figure{height:clamp(66px,12dvh,88px)}.diagram-note{padding-bottom:2px;font-size:9px}.status{flex-basis:39px;min-height:39px;padding:4px 7px}.quiz{gap:4px;padding:5px 7px}.question h2{font-size:12px}.answer{min-height:33px;padding:4px 6px;font-size:12px}.answer b{width:21px;height:21px;flex-basis:21px}.hint{padding:4px 6px}.footer{flex-basis:24px}.mine{min-height:75px}.brand-mark{width:26px;height:26px;font-size:13px}.top .brand-txt small{display:none}}
@media(max-height:570px){.diagram-top{padding-top:1px}.figure{height:61px}.diagram-note{display:none}.top{height:25px;flex-basis:25px}.status{flex-basis:34px;min-height:34px}.quiz{gap:3px}.answer{min-height:29px;padding:3px 5px}.mine{min-height:50px}}
@media(prefers-reduced-motion:reduce){.timer.warning,.answer.wrong{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="brand-mark">⛏</div><div class="brand-txt"><b>モグラの証明ダッシュ</b><small>16-BIT PROOF RUSH</small></div></div>
    <button id="pauseBtn" class="tiny" type="button" disabled>Ⅱ 一時停止</button>
  </header>
  <section class="diagram" aria-label="証明に使う図形">
    <div class="diagram-top"><strong>📜 図形の条件</strong><span>AB＝AC、BD＝CD</span></div>
    <svg class="figure" viewBox="0 0 360 180" role="img" aria-label="AとDを結ぶ共通な辺がある二つの三角形ABDとACD。ABとACが等しく、BDとCDが等しい">
      <polygon points="180,19 67,154 180,105" fill="#d9e9ed" fill-opacity=".7" stroke="#315775" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="180,19 180,105 293,154" fill="#d9e9ed" fill-opacity=".7" stroke="#315775" stroke-width="3" stroke-linejoin="round"/>
      <line x1="67" y1="154" x2="293" y2="154" stroke="#e5ddd0" stroke-width="1.5" stroke-dasharray="5 5"/>
      <line x1="180" y1="19" x2="180" y2="105" stroke="#1c7e9a" stroke-width="3.5"/>
      <!-- equal sides AB and AC: one tick -->
      <path d="M117 81 l11 10 M232 91 l11 -10" fill="none" stroke="#d16c38" stroke-width="4" stroke-linecap="round"/>
      <!-- equal sides BD and CD: two ticks -->
      <path d="M115 122 l7 14 M125 118 l7 14 M234 118 l7 14 M244 122 l7 14" fill="none" stroke="#d16c38" stroke-width="3" stroke-linecap="round"/>
      <g fill="#23364b" font-size="18" font-weight="800"><text x="174" y="13">A</text><text x="46" y="166">B</text><text x="299" y="166">C</text><text x="188" y="113">D</text></g>
    </svg>
    <div class="diagram-note">△ABD と △ACD の合同を使って ∠BAD＝∠DAC を証明しよう</div>
  </section>
  <div class="status" aria-label="制限時間と残りライフ">
    <div><div class="progress-text"><span id="gateCount">GATE 1 / 8</span><span id="statusTag">到達まで</span></div><div id="bar" class="timebar"><i id="barFill"></i></div></div>
    <strong id="timer" class="timer" aria-live="off">10.0</strong>
    <span class="hearts" id="hearts" aria-label="残りライフ3">♥♥♥</span>
  </div>
  <section class="mine" id="mine" aria-label="自動で地下へ進むモグラのドット絵ゲーム画面">
    <canvas id="world" width="288" height="236"></canvas>
    <div class="mine-top"><span class="depth" id="depth">深さ 0m</span><span class="speech" id="message">スタートすると自動で進むよ！</span></div>
    <div class="mine-bottom"><div class="lane-guide"><span>①</span><span>②</span><span>③</span></div></div>
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="ゲームメニュー">
      <div class="modal" id="modalContent">
        <div class="big">⛏️ 🐾 💎</div><h2>証明の道を掘り進め！</h2>
        <p>モグラは自動で地下へ！<br>扉に到達する前に、正しい<strong>言葉・式・記号</strong>を選ぼう。<br>全8つの関門を突破して証明を完成させよう。</p>
        <div class="modes" id="modes"><button class="mode" data-duration="16" type="button">じっくり<small>16秒 / 関門</small></button><button class="mode active" data-duration="11" type="button">ふつう<small>11秒 / 関門</small></button><button class="mode" data-duration="7" type="button">はやい<small>7秒 / 関門</small></button></div>
        <button class="primary" id="startBtn" type="button">▶ 冒険スタート！</button>
        <span class="tiny-note">時間切れでライフが1つ減少。ヒントで +3秒。</span>
      </div>
    </div>
  </section>
  <section class="quiz" aria-label="証明のパーツ選択">
    <div class="question"><h2 id="question">まずはゲームをスタートしよう！</h2><small id="stepType">証明の道</small></div>
    <div class="answers" id="answers"><button class="answer" disabled><b>①</b><span>スタートすると選択肢が現れます。</span></button></div>
    <div class="minirow"><span class="feedback" id="feedback" role="status">正しい道を選んで、モグラを助けよう。</span><button class="hint" id="hintBtn" type="button" disabled>💡 ヒント ＋3秒</button></div>
    <div class="hint-reveal" id="hintText" hidden></div>
  </section>
  <footer class="footer"><small>自動下降 × 証明8ステップ</small><div style="display:flex;gap:5px"><button id="muteBtn" type="button">♪ OFF</button><button id="notebookBtn" type="button" disabled>📓 証明ノート</button></div></footer>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const W=288,H=236,PATHX=[52,144,236];
const STEPS=[
 {type:'三角形',q:'どの2つの三角形について考える？',opts:['△ABD と △ACD','△ABC と △BDC','△ABD と △BDC'],a:0,hint:'証明したい角は、Aの近くにあるよ。2つの三角形を見つけよう。',note:'△ABDと△ACDにおいて、'},
 {type:'仮定',q:'仮定より、等しい辺はどれ？（その1）',opts:['AB＝AD','AB＝AC','AC＝CD'],a:1,hint:'図の1本の刻み印が付いた2辺を探そう。',note:'仮定より、AB＝AC ……①'},
 {type:'仮定',q:'仮定より、等しい辺はどれ？（その2）',opts:['AB＝BD','AD＝CD','BD＝CD'],a:2,hint:'図の2本の刻み印が付いた2辺を探そう。',note:'仮定より、BD＝CD ……②'},
 {type:'共通な辺',q:'2つの三角形に共通する辺は？',opts:['BC＝BC','AD＝AD','AB＝AB'],a:1,hint:'2つの三角形に重なる青色の辺を探そう。',note:'共通な辺だから、AD＝AD ……③'},
 {type:'合同条件',q:'①②③から、どの合同条件が使える？',opts:['2組の辺とその間の角がそれぞれ等しい。','1組の辺とその両端の角がそれぞれ等しい。','3組の辺がそれぞれ等しい。'],a:2,hint:'対応する「辺」の等しさが全部で何組あるか考えよう。',note:'①、②、③より、3組の辺がそれぞれ等しいので、'},
 {type:'合同の式',q:'合同を表す正しい記号の式は？',opts:['△ABD≡△ADC','△ABD≡△ACD','△ABD＝△ACD'],a:1,hint:'対応順は A↔A、B↔C、D↔D。合同には「≡」を使うよ。',note:'△ABD≡△ACD'},
 {type:'根拠',q:'合同から角が等しいといえる理由は？',opts:['合同な図形の対応する辺はそれぞれ等しいから','対頂角は等しいから','合同な図形の対応する角はそれぞれ等しいから'],a:2,hint:'今証明したいのは「角」の等しさだね。',note:'合同な図形の対応する角はそれぞれ等しいから、'},
 {type:'結論',q:'最後に示すべき角の式は？',opts:['∠BAD＝∠DAC','∠ABD＝∠DAC','∠BAD＝∠ADC'],a:0,hint:'Aを頂点とする、辺ADの両側の角を比べよう。',note:'∠BAD＝∠DAC'}
];
let state={phase:'ready',idx:0,lives:3,duration:11,remaining:11,p:0,chosen:false,choice:-1,wrong:0,hints:0,hintUsed:false,notes:[],frame:0,hitFlash:0,correctFlash:0,displayMessage:'',collisionClock:0,autoPause:false};
let last=0,lastHud=0,audio=false,audioCtx=null;
function sound(f=390,t='square',len=.07,volume=.035){if(!audio)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+len);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+len)}catch(e){}}
function setMessage(str){$('message').textContent=str;state.displayMessage=str}
function setModes(){for(const b of document.querySelectorAll('.mode'))b.classList.toggle('active',Number(b.dataset.duration)===state.duration)}
function noteHtml(){let rows=state.notes.map((s,i)=>`<div><b>${String(i+1).padStart(2,'0')}.</b> ${escapeHTML(s)}</div>`).join('');return `<div class="proof"><h3>完成した証明</h3>${rows||'<p>まだ証明は始まっていません。</p>'}</div>`}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateUI(){let i=Math.min(state.idx,STEPS.length-1),t=STEPS[i];$('gateCount').textContent=`GATE ${i+1} / ${STEPS.length}`;$('timer').textContent=state.remaining.toFixed(1);$('hearts').textContent='♥'.repeat(state.lives)+'♡'.repeat(3-state.lives);$('hearts').setAttribute('aria-label',`残りライフ${state.lives}`);const warning=state.remaining<=3&&state.phase==='playing'&&!state.chosen;$('timer').classList.toggle('warning',warning);$('bar').classList.toggle('warning',warning);$('barFill').style.width=`${Math.max(0,Math.min(100,state.remaining/state.duration*100))}%`;$('statusTag').textContent=state.chosen?'突破！':state.phase==='playing'?'到達まで':state.phase==='collision'?'岩に衝突！':'到達まで';$('depth').textContent=`深さ ${Math.round((state.idx+state.p)*12)}m`;$('pauseBtn').disabled=state.phase!=='playing'&&state.phase!=='paused';$('pauseBtn').textContent=state.phase==='paused'?'▶ 再開':'Ⅱ 一時停止';}
function setStep(){const t=STEPS[state.idx];state.remaining=state.duration;state.p=0;state.chosen=false;state.choice=-1;state.hintUsed=false;state.hitFlash=0;state.correctFlash=0;$('question').textContent=t.q;$('stepType').textContent=t.type;$('hintBtn').disabled=false;$('hintBtn').textContent='💡 ヒント ＋3秒';$('hintText').hidden=true;$('hintText').textContent='';$('feedback').textContent='ポイントに着く前に、正しい答えをタップ！';const root=$('answers');root.replaceChildren();t.opts.forEach((word,i)=>{let b=document.createElement('button');b.type='button';b.className='answer';b.dataset.idx=String(i);let n=document.createElement('b');n.textContent=['①','②','③'][i];let txt=document.createElement('span');txt.textContent=word;b.append(n,txt);b.addEventListener('click',()=>answer(i));root.appendChild(b)});setMessage('正しい道を選ぼう！');updateUI()}
function start(){state={...state,phase:'playing',idx:0,lives:3,remaining:state.duration,p:0,chosen:false,choice:-1,wrong:0,hints:0,hintUsed:false,notes:[],frame:0,hitFlash:0,correctFlash:0,collisionClock:0};$('overlay').hidden=true;$('notebookBtn').disabled=false;setStep();sound(640,'square',.08)}
function answer(i){if(state.phase!=='playing'||state.chosen)return;const t=STEPS[state.idx],buttons=[...document.querySelectorAll('#answers .answer')];if(i===t.a){state.choice=i;state.chosen=true;state.correctFlash=1;buttons[i].classList.add('good');buttons.forEach(b=>b.disabled=true);$('hintBtn').disabled=true;$('feedback').textContent='正解！ 扉が開いた！';setMessage('正解！ トンネル開通！');sound(620,'square',.1);setTimeout(()=>sound(870,'sine',.09),90)}else{state.wrong++;state.hitFlash=1;const b=buttons[i];if(b){b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500)}$('feedback').textContent='その道は違うよ。時間内にもう一度！';setMessage('あっ！ ほかの道を探して！');sound(145,'sawtooth',.13)}}
function hint(){if(state.phase!=='playing'||state.chosen||state.hintUsed)return;state.hintUsed=true;state.hints++;state.remaining+=3;state.p-=3/state.duration;$('hintText').textContent='💡 '+STEPS[state.idx].hint;$('hintText').hidden=false;$('hintBtn').disabled=true;$('hintBtn').textContent='💡 ヒント使用済';$('feedback').textContent='＋3秒！ 落ち着いて考えよう。';sound(480,'sine',.12);updateUI()}
function advanceStep(){state.notes.push(STEPS[state.idx].note);sound(880,'square',.09);if(state.idx===STEPS.length-1){complete();return}state.idx++;setStep()}
function collision(){state.phase='collision';state.lives--;state.wrong++;state.collisionClock=1100;state.hitFlash=1;setMessage('岩にぶつかった！');$('feedback').textContent=state.lives?'時間切れ！ 同じ問題に再挑戦！':'ライフがなくなった！';sound(120,'sawtooth',.22);updateUI()}
function gameOver(){state.phase='gameover';showOverlay(`<div class="big">🪨 💥</div><h2>あと一歩だった！</h2><p>${state.idx}/${STEPS.length} 関門突破！<br>間違えても大丈夫。もう一度チャレンジしよう。</p><button class="primary" id="retry" type="button">↺ 最初から挑戦</button><button class="secondary" id="notesBtn" type="button">📓 途中までの証明を見る</button>`);$('retry').onclick=start;$('notesBtn').onclick=showNotes;updateUI()}
function complete(){state.phase='complete';let stars=state.wrong===0&&state.hints===0?3:state.wrong<=2?2:1;showOverlay(`<div class="big">💎 🐾 💎</div><h2>証明トンネル開通！</h2><div class="result-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>全8つの関門を突破！<br>ミス ${state.wrong}回・ヒント ${state.hints}回</p>${noteHtml()}<button class="primary" id="retry" type="button">↺ もう一度プレイ</button>`);$('retry').onclick=start;setMessage('証明完成！');sound(980,'square',.2);updateUI()}
function showOverlay(html){$('modalContent').innerHTML=html;$('overlay').hidden=false}
function showNotes(){let paused=state.phase==='playing';if(paused)state.phase='paused';showOverlay(`<div class="big">📓</div><h2>証明ノート</h2>${noteHtml()}<button class="primary" id="closeNote" type="button">▶ ${paused?'ゲームを再開':'閉じる'}</button>`);$('closeNote').onclick=()=>{if(paused){state.phase='playing';$('overlay').hidden=true}else if(state.phase==='gameover'){gameOver()}else if(state.phase==='complete'){complete()}else{$('overlay').hidden=true}};updateUI()}
function togglePause(){if(state.phase==='playing'){state.phase='paused';showOverlay(`<div class="big">⏸</div><h2>一時停止</h2><p>タイマーは止まっています。</p><button class="primary" id="resume" type="button">▶ 再開する</button><button class="secondary" id="restart" type="button">↺ 最初から</button>`);$('resume').onclick=resume;$('restart').onclick=start}else if(state.phase==='paused')resume();updateUI()}
function resume(){state.phase='playing';$('overlay').hidden=true;last=performance.now();updateUI()}
function hash(x,y,z=0){let n=Math.imul(x+139,374761393)^Math.imul(y+z+17,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function pix(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
const palettes=[['#64452f','#745034','#826044','#523d32'],['#56413d','#60464b','#785253','#42393d'],['#3a465c','#4a526b','#586174','#323b50'],['#375565','#476576','#567486','#2c4959']];
function world(time){const phase=(state.idx+state.p)*240,shift=(state.p*140+state.idx*35)%16;const shade=palettes[Math.min(3,Math.floor(state.idx/2))];pix(0,0,W,H,shade[0]);let tilesY=Math.ceil(H/16)+1,offset=phase%16;for(let iy=-1;iy<tilesY;iy++){const wy=iy+Math.floor(phase/16);for(let ix=0;ix<18;ix++){let xx=ix*16,yy=iy*16-offset,k=hash(ix,wy);pix(xx,yy,16,16,shade[Math.floor(k*4)]);pix(xx,yy,16,2,shade[3]);if(k>.42){pix(xx+3,yy+7,5,2,'#a0815e');pix(xx+9,yy+12,3,2,'#413b37')}if(hash(ix,wy,2)>.94){pix(xx+6,yy+3,4,9,'#4e968e');pix(xx+8,yy+3,2,7,'#a9e2ca')}}}
// already-dug center shaft, horizontal texture, side walls
pix(104,0,80,H,'#1a2c38');pix(104,0,6,H,'#463f38');pix(178,0,6,H,'#624c39');for(let y=0;y<H+26;y+=23){let yy=(y-offset*2+H)%H;pix(110,yy,8,3,'#75624c');pix(171,yy+10,5,3,'#645a48')}
// glimpses of ancient ruins and crystals
for(let j=0;j<12;j++){const y=(j*63-phase*.7)%365;if(y<-20||y>H+20)continue;let x=j%2===0?28:250;pix(x,y,9,15,j%3===0?'#74cbca':'#8c7f67');pix(x+2,y-5,5,9,j%3===0?'#b1f6e0':'#bfa88a');pix(x+3,y+4,2,4,'#e3d2a5')}
const moleY=55;const gateY=H+30-state.p*(H-47);const active=state.phase==='playing'||state.phase==='collision';if(active&&state.p>.03){
 // branching stone threshold: three numbered doors
 pix(0,gateY,288,8,'#322f30');pix(0,gateY+8,288,4,'#ae8c5e');pix(11,gateY-43,266,43,'#3e3640');
 for(let j=0;j<3;j++){let center=PATHX[j];let selected=state.chosen&&state.choice===j;let col=selected?'#2c8b65':'#544e5f';pix(center-31,gateY-35,62,39,'#272c34');pix(center-27,gateY-30,54,29,col);pix(center-27,gateY-30,54,4,selected?'#baf6bd':'#918d7b');pix(center-19,gateY-26,38,18,selected?'#173b30':'#272936');ctx.fillStyle=selected?'#c6ffe3':'#ffe2a4';ctx.font='bold 15px monospace';ctx.textAlign='center';ctx.fillText(String(j+1),center,gateY-10);ctx.textAlign='start';pix(center-25,gateY-5,50,4,selected?'#95e2a9':'#bb9560')}
 if(state.chosen){pix(PATHX[state.choice]-28,gateY-7,56,7,'#3b9b6a')}
}
// animated character composed pixel by pixel, in front of world
const d=state.hitFlash>0?Math.round(Math.sin(time/40)*4):0,move=state.phase==='playing'?Math.round(Math.sin(time/125)*2):0;
let goalX=state.chosen?PATHX[state.choice]:144,x=144+(goalX-144)*Math.max(0,(state.p-.5)*2)+d,y=moleY+move;
// miner light
pix(x-23,y-28,46,42,'#26343c');pix(x-20,y-25,40,38,'#7d523d');pix(x-17,y-22,33,33,'#ab7450');pix(x-12,y-21,20,16,'#ca8f64');pix(x-9,y-20,7,10,'#e5b38a');pix(x+10,y-16,9,11,'#f0c3a1');pix(x+16,y-12,8,6,'#433139');pix(x+1,y-16,7,8,'#2b2c31');pix(x+3,y-16,3,4,'#fffbe7');pix(x-25,y-13,9,18,'#4c3731');pix(x-29,y-5,13,13,'#e3ad88');pix(x-27,y+4,10,4,'#fbdfb7');pix(x+13,y-2,17,13,'#725140');pix(x+21,y+3,12,6,'#f5d3a1');pix(x-15,y+13,13,7,'#342e31');pix(x+4,y+13,13,7,'#342e31');
// cap and lamp
pix(x-21,y-28,43,11,'#253742');pix(x-15,y-32,28,10,'#558b96');pix(x-12,y-32,25,3,'#9dd4cc');pix(x+12,y-27,15,11,'#29343c');pix(x+17,y-26,10,8,state.correctFlash>0?'#c8ffe1':'#f3d78e');pix(x+19,y-25,6,4,'#ffffdf');
// flying dirt particles; smoothly descending cues
for(let j=0;j<6;j++){let tt=(time/13+j*43)%300;let px=x+(j%2?1:-1)*(25+(tt%19)),py=y+13+tt*.10;if(py<H)pix(px,py,2+j%2,2,['#e0af76','#86654c','#b18e68'][j%3])}
if(state.hitFlash>0){pix(0,0,W,4,'#df8079');pix(0,H-4,W,4,'#df8079')}
if(state.correctFlash>0){pix(0,0,W,4,'#8bffd2')}
}
function frame(t){let dt=Math.min(100,Math.max(0,t-(last||t)));last=t;if(state.phase==='playing'){
 if(!state.chosen){state.remaining=Math.max(0,state.remaining-dt/1000);state.p=Math.min(1,1-state.remaining/state.duration);if(state.remaining<=0)collision()}
 else{state.p=Math.min(1,state.p+dt/580);if(state.p>=1)advanceStep()}
} else if(state.phase==='collision'){state.collisionClock-=dt;if(state.collisionClock<=0){if(state.lives===0)gameOver();else{state.phase='playing';setStep()}}}
state.hitFlash=Math.max(0,state.hitFlash-dt/450);state.correctFlash=Math.max(0,state.correctFlash-dt/750);world(t);if(t-lastHud>70){lastHud=t;updateUI()}requestAnimationFrame(frame)}
function setup(){for(const b of document.querySelectorAll('.mode'))b.onclick=()=>{state.duration=Number(b.dataset.duration);state.remaining=state.duration;setModes();updateUI()};$('startBtn').onclick=start;$('pauseBtn').onclick=togglePause;$('hintBtn').onclick=hint;$('notebookBtn').onclick=showNotes;$('muteBtn').onclick=()=>{audio=!audio;$('muteBtn').textContent=audio?'♫ ON':'♪ OFF';sound(600,'sine',.1)};document.addEventListener('keydown',e=>{if(state.phase==='playing'&&['1','2','3'].includes(e.key))answer(Number(e.key)-1);if(e.key==='Escape'){if(state.phase==='playing'||state.phase==='paused')togglePause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='playing'){state.autoPause=true;togglePause()}});setModes();updateUI();requestAnimationFrame(frame)}
window.__moleRush={get state(){return {...state,notes:[...state.notes]}},start,answer,hint,forceTimeout:()=>{if(state.phase==='playing'){state.remaining=0;collision()}},retry:start,showNotes};setup();
})();
